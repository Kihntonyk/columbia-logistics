<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warehouse Dashboard</title>
    <!-- Tailwind Play CDN -->
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  </head>

  <body class="min-h-screen bg-slate-50 text-slate-800 antialiased">
    <div class="mx-auto max-w-6xl px-4 py-8 sm:px-6">

      <!-- Header -->
      <header class="mb-8 flex flex-wrap items-end justify-between gap-4">
        <div>
          <h1 class="text-2xl font-semibold tracking-tight text-slate-900">
            Warehouse Dashboard
          </h1>
          <p class="mt-1 text-sm text-slate-500">
            Columbia Logistics · live inventory
          </p>
        </div>
        <button id="refresh-button" type="button"
          class="rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm font-medium text-slate-700 shadow-sm hover:bg-slate-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
          Refresh
        </button>
      </header>

      <div id="banner" role="status" aria-live="polite"
        class="mb-6 hidden items-start justify-between gap-4 rounded-lg border px-4 py-3 text-sm">
        <p id="banner-message"></p>
        <button id="banner-close" type="button" aria-label="Dismiss"
          class="shrink-0 font-semibold opacity-60 hover:opacity-100">
          ✕
        </button>
      </div>

      <section class="mb-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
        <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-xs font-medium uppercase tracking-wide text-slate-500">
            Items tracked
          </p>
          <p id="stat-items" class="mt-1 text-2xl font-semibold text-slate-900">
            –
          </p>
        </div>
        <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-xs font-medium uppercase tracking-wide text-slate-500">
            Total units
          </p>
          <p id="stat-units" class="mt-1 text-2xl font-semibold text-slate-900">
            –
          </p>
        </div>
        <div class="rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
          <p class="text-xs font-medium uppercase tracking-wide text-slate-500">
            Low stock
          </p>
          <p id="stat-low" class="mt-1 text-2xl font-semibold text-slate-900">
            –
          </p>
        </div>
      </section>

      <div class="grid grid-cols-1 gap-6 lg:grid-cols-3">


        <section class="overflow-hidden rounded-xl border border-slate-200 bg-white shadow-sm lg:col-span-2">
          <div class="border-b border-slate-200 px-4 py-3">
            <h2 class="text-sm font-semibold text-slate-900">Inventory</h2>
          </div>

          <div class="overflow-x-auto">
            <table class="min-w-full divide-y divide-slate-200 text-sm">
              <thead class="bg-slate-50 text-left text-xs font-medium uppercase tracking-wide text-slate-500">
                <tr>
                  <th scope="col" class="px-4 py-3">ID</th>
                  <th scope="col" class="px-4 py-3">Item</th>
                  <th scope="col" class="px-4 py-3 text-right">Stock</th>
                  <th scope="col" class="px-4 py-3">Shelf</th>
                  <th scope="col" class="px-4 py-3">Supplier</th>
                </tr>
              </thead>
              <tbody id="inventory-body" class="divide-y divide-slate-100">
                <tr>
                  <td colspan="5" class="px-4 py-6 text-center text-slate-500">
                    Loading inventory…
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>

        <!-- Order form -->
        <section class="h-fit rounded-xl border border-slate-200 bg-white p-4 shadow-sm">
          <h2 class="mb-4 text-sm font-semibold text-slate-900">Place an order</h2>
          <form id="order-form" class="space-y-4" novalidate>
            <div>
              <label for="item-select" class="mb-1 block text-sm font-medium text-slate-700">
                Item
              </label>
              <select id="item-select" name="item_id" required
                class="block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                <option value="">Loading items…</option>
              </select>
            </div>
            <div>
              <label for="quantity-input" class="mb-1 block text-sm font-medium text-slate-700">
                Quantity
              </label>
              <input id="quantity-input" name="quantity" type="number" min="1" step="1" value="1" required
                class="block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm shadow-sm focus:border-indigo-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
            </div>
            <button id="order-button" type="submit"
              class="w-full rounded-lg bg-indigo-600 px-4 py-2 text-sm font-semibold text-white shadow-sm hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:ring-offset-2 disabled:cursor-not-allowed disabled:opacity-60">
              Submit order
            </button>
          </form>
        </section>
      </div>
    </div>

    <script>

      const LOW_STOCK_THRESHOLD = 5;

      // --- Element references ---
      const inventoryBody = document.getElementById("inventory-body");
      const itemSelect = document.getElementById("item-select");
      const quantityInput = document.getElementById("quantity-input");
      const orderForm = document.getElementById("order-form");
      const orderButton = document.getElementById("order-button");
      const refreshButton = document.getElementById("refresh-button");
      const banner = document.getElementById("banner");
      const bannerMessage = document.getElementById("banner-message");
      const statItems = document.getElementById("stat-items");
      const statUnits = document.getElementById("stat-units");
      const statLow = document.getElementById("stat-low");

      // --- Banner ---
      const BANNER_STYLES = {
        success: "border-green-200 bg-green-50 text-green-800",
        error: "border-red-200 bg-red-50 text-red-800",
      };
      let bannerTimer;

      function showBanner(type, message) {
        clearTimeout(bannerTimer);
        banner.className = `mb-6 flex items-start justify-between gap-4 rounded-lg border px-4 py-3 text-sm ${BANNER_STYLES[type]}`;
        bannerMessage.textContent = message;
        if (type === "success") {
          bannerTimer = setTimeout(hideBanner, 5000);
        }
      }

      function hideBanner() {
        banner.classList.add("hidden");
        banner.classList.remove("flex");
      }

      document.getElementById("banner-close").addEventListener("click", hideBanner);

      // --- Rendering ---
      function createCell(text, className = "") {
        const cell = document.createElement("td");
        cell.className = `px-4 py-3 ${className}`;
        cell.textContent = text;
        return cell;
      }

      function createLowStockBadge() {
        const badge = document.createElement("span");
        badge.className =
          "ml-2 inline-flex items-center rounded-full bg-red-100 px-2 py-0.5 text-xs font-medium text-red-700 ring-1 ring-inset ring-red-600/20";
        badge.textContent = "Low Stock";
        return badge;
      }

      function renderTable(items) {
        inventoryBody.replaceChildren();

        if (items.length === 0) {
          const row = document.createElement("tr");
          row.appendChild(createCell("No items in inventory.", "py-6 text-center text-slate-500"));
          row.firstChild.colSpan = 5;
          inventoryBody.appendChild(row);
          return;
        }

        for (const item of items) {
          const isLow = item.stock_count < LOW_STOCK_THRESHOLD;
          const row = document.createElement("tr");
          row.className = isLow ? "bg-red-50/40" : "hover:bg-slate-50";

          row.appendChild(createCell(item.item_id, "font-mono text-slate-500"));

          const nameCell = createCell(item.item_name, "font-medium text-slate-900");
          if (isLow) nameCell.appendChild(createLowStockBadge());
          row.appendChild(nameCell);

          row.appendChild(
            createCell(
              item.stock_count,
              `text-right tabular-nums ${isLow ? "font-semibold text-red-700" : ""}`,
            ),
          );
          row.appendChild(createCell(item.shelf_location, "text-slate-600"));
          row.appendChild(createCell(item.supplier_name, "text-slate-600"));

          inventoryBody.appendChild(row);
        }
      }

      function renderItemOptions(items) {
        const previous = itemSelect.value;
        itemSelect.replaceChildren();

        const placeholder = new Option("Select an item…", "");
        placeholder.disabled = true;
        itemSelect.appendChild(placeholder);

        for (const item of items) {
          const label = `#${item.item_id} · ${item.item_name} (${item.stock_count} in stock)`;
          itemSelect.appendChild(new Option(label, item.item_id));
        }

        const stillExists = items.some((item) => String(item.item_id) === previous);
        itemSelect.value = stillExists ? previous : "";
      }

      function renderStats(items) {
        const totalUnits = items.reduce((sum, item) => sum + item.stock_count, 0);
        const lowCount = items.filter((item) => item.stock_count < LOW_STOCK_THRESHOLD).length;
        statItems.textContent = items.length;
        statUnits.textContent = totalUnits.toLocaleString();
        statLow.textContent = lowCount;
        statLow.classList.toggle("text-red-600", lowCount > 0);
      }

      function renderLoadError() {
        inventoryBody.replaceChildren();
        const row = document.createElement("tr");
        row.appendChild(createCell("Could not load inventory.", "py-6 text-center text-red-600"));
        row.firstChild.colSpan = 5;
        inventoryBody.appendChild(row);
      }

      // --- Data loading ---
      async function loadInventory() {
        try {
          const response = await fetch("/api/inventory");
          if (!response.ok) {
            throw new Error(`Server responded with ${response.status}`);
          }
          const items = await response.json();
          renderTable(items);
          renderItemOptions(items);
          renderStats(items);
        } catch (error) {
          console.error("Failed to load inventory:", error);
          renderLoadError();
          showBanner("error", "Could not load inventory. Is the server running?");
        }
      }

      // --- Order submission ---

      function describeOrderError(data, status) {
        if (data.error === "Insufficient stock") {
          return `Insufficient stock for item #${data.item_id}: requested ${data.requested}, only ${data.available} available.`;
        }
        return data.error || `Order failed (HTTP ${status}).`;
      }

      orderForm.addEventListener("submit", async (event) => {
        event.preventDefault();

        const itemId = Number(itemSelect.value);
        const quantity = Number(quantityInput.value);

        if (!itemSelect.value) {
          showBanner("error", "Please select an item.");
          return;
        }
        if (!Number.isInteger(quantity) || quantity < 1) {
          showBanner("error", "Quantity must be a whole number of at least 1.");
          return;
        }

        orderButton.disabled = true;
        orderButton.textContent = "Submitting…";

        try {
          const response = await fetch("/api/order", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ item_id: itemId, quantity }),
          });

          const data = await response.json().catch(() => ({}));

          if (response.ok) {
            showBanner(
              "success",
              `Order placed: ${data.quantity_ordered} × ${data.item_name}. ${data.remaining_stock} remaining.`,
            );
            quantityInput.value = 1;
          } else {
            showBanner("error", describeOrderError(data, response.status));
          }
        } catch (error) {
          console.error("Order request failed:", error);
          showBanner("error", "Could not reach the server. Please try again.");
        } finally {
          orderButton.disabled = false;
          orderButton.textContent = "Submit order";

          loadInventory();
        }
      });

      refreshButton.addEventListener("click", loadInventory);


      loadInventory();
    </script>
  </body>

</html>
